[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wos-client"
version = "0.1.0"
description = "Python client for the Clarivate Web of Science Expanded API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7", "pandas>=1.3"]

[project.scripts]
wos = "wos_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
